<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painting Exercises Values</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <h1>Painting Exercises - Values</h1>
  <a href="replay.html" id="replay-link">Session Replay →</a>

  <!-- Top controls (shown only when stage is active) -->
  <div id="top-controls" style="display:none">
    <button id="change-image-btn" class="toolbar-btn">← Change image</button>
    <div id="zoom-group">
      <span class="toolbar-label">Zoom</span>
      <input type="range" id="zoom-slider" min="25" max="100" value="100" step="5" />
      <span id="zoom-value">100%</span>
    </div>
  </div>

  <!-- Landing screen (hidden once an image is loaded) -->
  <div id="landing">

    <!-- Upload -->
    <div id="upload-area">
      <label id="upload-label" for="file-input">Choose or drop a reference image</label>
      <input type="file" id="file-input" accept="image/*" />
      <p id="hint">Upload an image to begin</p>
    </div>

    <!-- Example gallery -->
    <div id="example-gallery">
      <span class="gallery-label">or choose an example</span>
      <div id="example-thumbs">
        <button class="example-thumb" data-src="images/zorn1891-waltz.jpg" data-name="zorn1891-waltz.jpg">
          <img src="images/zorn1891-waltz.jpg" alt="Zorn – The Waltz" />
          <span>Zorn – The Waltz, 1891</span>
        </button>
        <button class="example-thumb" data-src="images/sargent1878-austin.jpg" data-name="sargent1878-austin.jpg">
          <img src="images/sargent1878-austin.jpg" alt="Sargent – Austin" />
          <span>Sargent – Austin, 1878</span>
        </button>
        <button class="example-thumb" data-src="images/gaugin1892-taitian.webp" data-name="gaugin1892-taitian.webp">
          <img src="images/gaugin1892-taitian.webp" alt="Gauguin – Tahitian" />
          <span>Gauguin – Tahitian, 1892</span>
        </button>
      </div>
    </div>

  </div>

  <!-- Stage (hidden until image loads) -->
  <div id="stage">

    <!-- Reference image + its toolbar -->
    <div id="ref-container">
      <img id="ref-img" alt="Reference" />
      <div id="ref-toolbar" class="sub-toolbar">
        <button id="bw-btn" class="toolbar-btn">B&amp;W</button>
        <div class="toolbar-divider"></div>
        <span class="toolbar-label">Blur</span>
        <input type="range" id="blur-slider" min="0" max="20" value="0" step="1" />
        <span id="blur-value">Off</span>
      </div>
    </div>

    <!-- Drawing canvas + its toolbar -->
    <div id="canvas-container">
      <canvas id="drawing-canvas"></canvas>
      <div id="canvas-toolbar" class="sub-toolbar">
        <div class="toolbar-row">
          <span class="toolbar-label">Color</span>
          <div id="color-group">
            <div class="swatch active" id="swatch-black" data-color="0,0,0"       title="Black"></div>
            <div class="swatch"        id="swatch-grey"  data-color="125,125,125" title="Grey"></div>
            <div class="swatch"        id="swatch-white" data-color="250,250,250" title="White"></div>
          </div>
        </div>
        <div class="toolbar-row">
          <span class="toolbar-label">Size</span>
          <div id="size-group">
            <input type="range" id="brush-size-slider" min="2" max="100" value="16" />
            <span id="brush-size-value">16px</span>
          </div>
        </div>
        <!-- <button id="clear-btn" class="toolbar-btn">Clear</button> -->
        <div class="toolbar-row">
          <button id="export-btn"   class="toolbar-btn">Export JSON</button>
          <button id="save-png-btn" class="toolbar-btn">Save PNG</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Custom cursor ring -->
  <div id="cursor-ring"></div>

  <script src="js/recorder.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
